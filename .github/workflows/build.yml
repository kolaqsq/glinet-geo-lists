name: build

on:
  schedule:
    # GL.iNet fetches the list at 03:00 router time (00:00 UTC in Moscow). GitHub often starts
    # scheduled runs hours late (~4 h observed), so build at 16:00 UTC to be published well before.
    - cron: "0 16 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config.json
      - NOTICE
      - COPYING.GPL-3.0
      - glgeo/**
      - scripts/**
      - tests/**
      - .github/workflows/build.yml

permissions:
  contents: write
  actions: write  # keepalive step below

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: python3 -m unittest discover -s tests

      - name: Fetch previous index
        run: |
          if git fetch -q --depth=1 origin release; then
            git show FETCH_HEAD:index.json > "$RUNNER_TEMP/previous-index.json"
          else
            echo "No release branch yet, shrink guard will be skipped"
          fi

      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build.py --out out --previous-index "$RUNNER_TEMP/previous-index.json" --summary "$GITHUB_STEP_SUMMARY"

      - name: Publish to release branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cp NOTICE COPYING.GPL-3.0 out/
          cd out
          git init -q -b release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build $(date -u +%F)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" release
          echo "Published to \`release\` as $(git rev-parse --short HEAD)." >> "$GITHUB_STEP_SUMMARY"

      # GitHub disables the schedule of a public repository after 60 days without "activity"
      # (not defined; the bot's push to release may not count). Re-enabling an enabled workflow
      # is harmless and may reset that timer. Runs even when the build failed.
      - name: Keep schedule enabled
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/enable"
